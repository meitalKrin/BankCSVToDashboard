services:
  actual-server:
    image: actualbudget/actual-server:26.6.0-alpine@sha256:1d2712f4a69677f94c27f0ccdd817903dab5fa897f0e0ff4e165f9c77a8ebbb5
    container_name: actual-server
    ports:
      - "127.0.0.1:5006:5006"
    volumes:
      - actual-data:/data
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5006/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  actual-data:
